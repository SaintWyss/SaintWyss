
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="360"
     viewBox="0 0 1200 360"
     role="img"
     aria-labelledby="title desc">

  <title id="title">SaintWyss - Developer Portfolio</title>
  <desc id="desc">Presentación de Santiago Vicente Scacciaferro Wyss, desarrollador de software orientado a backend e inteligencia artificial aplicada.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080E1D"/>
      <stop offset="100%" stop-color="#162544"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36"
            fill="none"
            stroke="#7DD3FC"
            stroke-width="0.5"
            opacity="0.12"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="15"
                    flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="360" rx="18" fill="url(#background)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <!-- Elementos decorativos -->
  <circle cx="1120" cy="35" r="150" fill="#22D3EE" opacity="0.035"/>
  <circle cx="1150" cy="310" r="180" fill="#818CF8" opacity="0.045"/>

  <!-- Terminal -->
  <g filter="url(#shadow)">
    <rect x="42" y="45" width="458" height="270" rx="14"
          fill="#0B1220" stroke="#334766" stroke-width="1.5"/>

    <path d="M56 45H486Q500 45 500 59V81H42V59Q42 45 56 45Z"
          fill="#172339"/>

    <circle cx="64" cy="64" r="5" fill="#FB7185"/>
    <circle cx="82" cy="64" r="5" fill="#FBBF24"/>
    <circle cx="100" cy="64" r="5" fill="#34D399"/>

    <text x="135" y="69"
          font-family="monospace" font-size="13"
          fill="#94A3B8">saintwyss@dev:~</text>

    <g font-family="monospace" font-size="16">
      <text x="65" y="117" fill="#5EEAD4">$ whoami</text>
      <text x="65" y="144" fill="#E2E8F0">Santiago Scacciaferro Wyss</text>

      <text x="65" y="181" fill="#5EEAD4">$ cat interests.txt</text>
      <text x="65" y="208" fill="#93C5FD">backend / ai / software engineering</text>

      <text x="65" y="245" fill="#5EEAD4">$ status --career</text>
      <text x="65" y="272" fill="#86EFAC">available for junior opportunities</text>
      <rect x="434" y="257" width="9" height="16" fill="#5EEAD4"/>
    </g>
  </g>

  <!-- Identidad -->
  <text x="550" y="66"
        font-family="monospace"
        font-size="14"
        font-weight="600"
        letter-spacing="2"
        fill="#5EEAD4">SAINTWYSS / DEVELOPER PORTFOLIO</text>

  <text x="550" y="121"
        font-family="Arial, Helvetica, sans-serif"
        font-size="41"
        font-weight="700"
        fill="#F8FAFC">Santiago Vicente</text>

  <text x="550" y="171"
        font-family="Arial, Helvetica, sans-serif"
        font-size="41"
        font-weight="700"
        fill="#F8FAFC">Scacciaferro Wyss</text>

  <rect x="550" y="190" width="270" height="4" rx="2"
        fill="url(#accent)"/>

  <text x="550" y="224"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        font-weight="600"
        fill="#93C5FD">Software Developer</text>

  <text x="550" y="250"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        fill="#CBD5E1">Backend · Applied AI · Software Engineering</text>

  <text x="550" y="283"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        fill="#94A3B8">Ingeniería en Sistemas · UTN FRRe</text>

  <!-- Estado -->
  <rect x="550" y="300" width="216" height="32" rx="16"
        fill="#10352F" stroke="#1D6655"/>

  <circle cx="568" cy="316" r="5" fill="#4ADE80"/>

  <text x="583" y="321"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        font-weight="600"
        fill="#BBF7D0">Open to opportunities</text>

  <!-- Decoración lateral -->
  <path d="M1100 90H1145V135"
        stroke="#22D3EE" stroke-width="2"
        stroke-linecap="round" opacity="0.5"/>

  <path d="M1100 270H1145V225"
        stroke="#818CF8" stroke-width="2"
        stroke-linecap="round" opacity="0.5"/>

</svg>
